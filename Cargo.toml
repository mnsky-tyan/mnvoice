[package]
name = "mnvoice"
version = "0.1.35"
edition = "2021"
description = "Ultra-low-latency, hands-free push-to-talk dictation utility with real-time streaming and zero-clipboard typing"
license = "MIT"

# Embedded in the exe's version resource alongside the defaults winres fills
# from this table (FileVersion, ProductVersion, ProductName). A complete,
# honest identity table is what reputation heuristics read first on an
# unsigned binary: an empty OriginalFilename on an exe named mnvoice.exe is
# exactly the mismatch that makes security software guess.
[package.metadata.winres]
OriginalFilename = "mnvoice.exe"
FileDescription = "Push-to-talk dictation - types your speech at the cursor"
CompanyName = "mnvoice"
LegalCopyright = "MIT License"

[build-dependencies]
png = "0.17"
winres = "0.1"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The Linux and macOS ports: audio capture, text injection, and network
# transport. All are cfg-gated by target rather than optional features so a
# plain `cargo build` on those platforms produces a working binary.
[target.'cfg(not(windows))'.dependencies]
cpal = "0.15"
# The x11 feature is x11rb, pure Rust, so no builder needs libxdo. It does
# not remove every system library: enigo links xkbcommon on Linux whichever
# backend is picked, so the released binary needs libxkbcommon at runtime
# (documented in the README's Linux section).
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }

# TLS is split per target, and no network dependency is declared for both
# targets: Cargo unions the features of every matching [target] entry, so a
# shared `ureq = "2"` keeps its default rustls + webpki-roots stack on macOS
# and the bundled Mozilla roots outrank Security.framework there. Linux gets
# rustls + ring with Mozilla root certificates compiled in (Linux has no single
# trusted root store to query); macOS gets native-tls, which is
# Security.framework and therefore the platform's own verifier and keychain
# trust. See unix_http.rs.
[target.'cfg(target_os = "linux")'.dependencies]
# The desktop app's portals: the global hotkey (GlobalShortcuts) and the
# Wayland typing session (RemoteDesktop). ashpd is the maintained XDG portals
# wrapper - the reis crate's own type-text example uses it - and the async-io
# feature keeps tokio out of the binary, which the engine's no-async-runtime
# ethos asks for.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast"] }
# The keysym each character maps to for the portal's keyboard injection.
xkbcommon = "0.8"
# The orb's layer-shell overlay surface.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Driving the portal futures and the orb's shm buffers without a runtime.
futures-executor = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }
rustix = { version = "0.38", features = ["mm", "fs"] }
# The system tray: the StatusNotifierItem protocol Plasma's panel consumes.
# `blocking` gives the no-async-runtime surface; `async-io` keeps tokio out of
# the binary, matching ashpd's default feature set (both sit on zbus 5).
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
enumflags2 = "0.7"

# The rustls dependency is for the crypto provider only (see unix_http.rs);
# the stack itself is behind ureq and tungstenite's rustls feature.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# default-features = false is what drops ureq's default `tls` (rustls +
# webpki-roots). tungstenite's `handshake` is not a TLS feature - it is the
# HTTP upgrade machinery, needed on both.
tungstenite = { version = "0.26", default-features = false, features = [
    "handshake",
    "native-tls",
] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }

# The Windows test suite drives a real WebSocket server (stream.rs's
# `live_provider`) and has to compute `Sec-WebSocket-Accept` for the handshake.
# `handshake` is the HTTP upgrade machinery, not a TLS feature, so it carries no
# TLS stack and no platform coupling; the dependency is test-only, so the
# Windows release binary is unchanged. Without it the test spelled SHA-1 and
# base64 by hand in ~95 lines while unix_http.rs's tests called
# `derive_accept_key` for the same job - two implementations of one digest in
# one suite, which is what this removes.
[target.'cfg(windows)'.dev-dependencies]
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
