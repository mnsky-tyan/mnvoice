name: Release

# Releases are per platform: one tag per platform (v0.1.15-win / -linux /
# -macos), one release per tag, each carrying only that platform's artifacts.
# A pull_request still builds and tests all three jobs - that is where the port
# is verified on real Linux and macOS runners, since the gate on this machine
# can only drive Windows.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # A bare vX.Y.Z tag is the legacy Windows shape - every release before the
    # split - and vX.Y.Z-win is the current one, so both belong to this job.
    # On a pull_request there is no tag to interpret, so all jobs build.
    if: >-
      github.event_name == 'pull_request' ||
      endsWith(github.ref_name, '-win') ||
      !contains(github.ref_name, '-')
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The release must not ship a suite that fails on the runner that built
      # it, so the Windows job runs the same suite the gate runs locally.
      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # The raw exe is the asset the in-app updater downloads, and it is also
      # what a user gets when they would rather not unpack a zip.
      - name: Package artifacts
        run: |
          mkdir dist
          cp target/release/mnvoice.exe dist/
          # The raw exe is also left at the workspace root so the publish step can
          # hand it to gh; only the zip is created from dist.
          cp target/release/mnvoice.exe mnvoice.exe
          cp mnvoice.env.example dist/
          cp keywords.txt.example dist/
          Compress-Archive -Path dist/* -DestinationPath mnvoice-windows-x64.zip
          # A published hash is the only way to check a download independently of
          # where it was fetched from, so it ships with every release.
          Get-FileHash -Algorithm SHA256 mnvoice.exe, mnvoice-windows-x64.zip |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content -Path SHA256SUMS -Encoding utf8

      # Uses the preinstalled gh CLI rather than softprops/action-gh-release,
      # which silently succeeds while uploading nothing under the Node 24 runtime.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          foreach ($f in @('mnvoice.exe','mnvoice-windows-x64.zip','SHA256SUMS')) {
            if (!(Test-Path $f)) { throw "$f was not produced" }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag mnvoice.exe mnvoice-windows-x64.zip SHA256SUMS --clobber
          } else {
            gh release create $tag --title $tag --verify-tag mnvoice.exe mnvoice-windows-x64.zip SHA256SUMS
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }
          Write-Host "published $tag"

      # Belt and braces: an empty release must never ship unnoticed again.
      - name: Verify asset attached
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          # The REST endpoint is asked directly: gh's own release listing is
          # cached and can still lag behind an upload that just succeeded, which
          # would fail this step after a publish that actually worked.
          $json = curl.exe -sS -f -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/mnsky-tyan/mnvoice/releases/tags/$tag" | Out-String
          if ($LASTEXITCODE -ne 0) { throw "could not read $tag from api.github.com (curl exit $LASTEXITCODE)" }
          $names = ($json | ConvertFrom-Json).assets.name
          # mnvoice.exe is mandatory: it is what the updater fetches.
          foreach ($need in @('mnvoice.exe','mnvoice-windows-x64.zip','SHA256SUMS')) {
            if ((($names -split "`n") -notcontains $need)) {
              throw "release $tag is missing $need. Assets found: '$names'"
            }
          }
          Write-Host "confirmed assets on $tag"

  linux:
    if: >-
      github.event_name == 'pull_request' ||
      endsWith(github.ref_name, '-linux')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system libraries
        # cpal needs the ALSA headers (PipeWire arrives through its ALSA layer)
        # and enigo's injector links xkbcommon whichever X11 backend it uses.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          cp target/release/mnvoice mnvoice-linux-x64
          sha256sum mnvoice-linux-x64 | awk '{print $1"  "$2}' > mnvoice-linux-x64.sha256

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" mnvoice-linux-x64 mnvoice-linux-x64.sha256 --clobber
          else
            gh release create "$tag" --title "$tag" --verify-tag mnvoice-linux-x64 mnvoice-linux-x64.sha256
          fi

      - name: Verify asset attached
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          names=$(curl -sS -f -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/mnsky-tyan/mnvoice/releases/tags/${{ github.ref_name }}" \
            | jq -r '.assets[].name')
          echo "$names" | grep -qx 'mnvoice-linux-x64'

  macos:
    if: >-
      github.event_name == 'pull_request' ||
      endsWith(github.ref_name, '-macos')
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Test
        run: cargo test --locked --target aarch64-apple-darwin

      - name: Build release
        # The target is named explicitly rather than taken from the runner:
        # the release asset is published under the arm64 name, so an
        # Intel-armed image switching under us must not silently change it.
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package artifact
        run: |
          cp target/aarch64-apple-darwin/release/mnvoice mnvoice-macos-arm64
          shasum -a 256 mnvoice-macos-arm64 | awk '{print $1"  "$2}' > mnvoice-macos-arm64.sha256

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" mnvoice-macos-arm64 mnvoice-macos-arm64.sha256 --clobber
          else
            gh release create "$tag" --title "$tag" --verify-tag mnvoice-macos-arm64 mnvoice-macos-arm64.sha256
          fi

      - name: Verify asset attached
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          names=$(curl -sS -f -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/mnsky-tyan/mnvoice/releases/tags/${{ github.ref_name }}" \
            | jq -r '.assets[].name')
          echo "$names" | grep -qx 'mnvoice-macos-arm64'
