name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --locked

      # The raw exe is the asset the in-app updater downloads, and it is also
      # what a user gets when they would rather not unpack a zip.
      - name: Package artifacts
        run: |
          mkdir dist
          cp target/release/mnvoice.exe dist/
          cp mnvoice.env.example dist/
          cp keywords.txt.example dist/
          Compress-Archive -Path dist/* -DestinationPath mnvoice-windows-x64.zip

      # Uses the preinstalled gh CLI rather than softprops/action-gh-release,
      # which silently succeeds while uploading nothing under the Node 24 runtime.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          foreach ($f in @('mnvoice.exe','mnvoice-windows-x64.zip')) {
            if (!(Test-Path $f)) { throw "$f was not produced" }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag mnvoice.exe mnvoice-windows-x64.zip --clobber
          } else {
            gh release create $tag --title $tag --verify-tag mnvoice.exe mnvoice-windows-x64.zip
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }
          Write-Host "published $tag"

      # Belt and braces: an empty release must never ship unnoticed again.
      - name: Verify asset attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $names = gh release view $tag --json assets --jq '.assets[].name'
          # mnvoice.exe is mandatory: it is what the updater fetches.
          foreach ($need in @('mnvoice.exe','mnvoice-windows-x64.zip')) {
            if ((($names -split "`n") -notcontains $need)) {
              throw "release $tag is missing $need. Assets found: '$names'"
            }
          }
          Write-Host "confirmed assets on $tag"
