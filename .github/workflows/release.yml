name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --locked

      - name: Package artifacts
        run: |
          mkdir dist
          cp target/release/mnvoice.exe dist/
          cp mnvoice.env.example dist/
          cp keywords.txt.example dist/
          Compress-Archive -Path dist/* -DestinationPath mnvoice-windows-x64.zip

      # Uses the preinstalled gh CLI rather than softprops/action-gh-release,
      # which silently succeeds while uploading nothing under the Node 24 runtime.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          if (!(Test-Path mnvoice-windows-x64.zip)) { throw "mnvoice-windows-x64.zip was not produced" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag mnvoice-windows-x64.zip --clobber
          } else {
            gh release create $tag --title $tag --verify-tag mnvoice-windows-x64.zip
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }
          Write-Host "published $tag"

      # Belt and braces: an empty release must never ship unnoticed again.
      - name: Verify asset attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $names = gh release view $tag --json assets --jq '.assets[].name'
          if ((($names -split "`n") -notcontains 'mnvoice-windows-x64.zip')) {
            throw "release $tag is missing mnvoice-windows-x64.zip. Assets found: '$names'"
          }
          Write-Host "confirmed asset on $tag"
