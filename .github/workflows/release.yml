name: Release

# Releases are per platform: one tag per platform (v0.1.15-win / -linux /
# -macos), one release per tag, each carrying only that platform's artifacts.
# A pull_request still builds and tests all three jobs - that is where the port
# is verified on real Linux and macOS runners, which a single-platform checkout
# can never do for itself.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # A bare vX.Y.Z tag is the legacy Windows shape - every release before the
    # split - and vX.Y.Z-win is the current one, so both belong to this job.
    # On a pull_request there is no tag to interpret, so all jobs build.
    if: >-
      github.event_name == 'pull_request' ||
      endsWith(github.ref_name, '-win') ||
      !contains(github.ref_name, '-')
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The release tag and the crate version must name the same release: the
      # updater compares tags, Windows Explorer reads Cargo.toml, and a tag
      # pushed without the bump ships a binary whose two versions disagree.
      - name: Verify the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          named="${tag#v}"          # drop the leading v
          named="${named%%-*}"      # drop a platform suffix (-win/-linux/-macos)
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$named" != "$crate" ]; then
            echo "::error file=Cargo.toml::release tag $tag names version $named, but Cargo.toml declares $crate - bump the crate before tagging"
            exit 1
          fi
          echo "tag $tag matches crate version $crate"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The release must not ship a suite that fails on the runner that built
      # it, so the Windows job runs the same suite the gate runs locally.
      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # The raw exe is the asset the in-app updater downloads, and it is also
      # what a user gets when they would rather not unpack a zip. The shared
      # action owns the packaging contract: binary under its released name,
      # a sidecar in "<lowercase-hash>  <basename>" form with LF endings
      # (SHA256SUMS is the one spelling update.rs's CHECKSUMS_ASSET reads),
      # and the zip staged from the exe plus the two companion templates.
      - name: Package artifacts
        uses: ./.github/actions/package-release
        with:
          binary: target/release/mnvoice.exe
          asset: mnvoice.exe
          sidecar: SHA256SUMS
          zip: mnvoice-windows-x64.zip
          zip_extra: mnvoice.env.example keywords.txt.example

      # The shared publish step uses the preinstalled gh CLI rather than
      # softprops/action-gh-release, which silently succeeds while uploading
      # nothing under the Node 24 runtime, and verifies each asset over the
      # REST API after upload.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ github.ref_name }}
          files: |
            mnvoice.exe
            mnvoice-windows-x64.zip
            SHA256SUMS

  linux:
    if: >-
      github.event_name == 'pull_request' ||
      endsWith(github.ref_name, '-linux')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The release tag and the crate version must name the same release: the
      # updater compares tags, Windows Explorer reads Cargo.toml, and a tag
      # pushed without the bump ships a binary whose two versions disagree.
      - name: Verify the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          named="${tag#v}"          # drop the leading v
          named="${named%%-*}"      # drop a platform suffix (-win/-linux/-macos)
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$named" != "$crate" ]; then
            echo "::error file=Cargo.toml::release tag $tag names version $named, but Cargo.toml declares $crate - bump the crate before tagging"
            exit 1
          fi
          echo "tag $tag matches crate version $crate"

      - name: Install system libraries
        # cpal needs the ALSA headers (PipeWire arrives through its ALSA layer)
        # and enigo's injector links xkbcommon whichever X11 backend it uses.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # sha256sum already prints "<hash>  <name>" with two spaces, the exact
      # format the updater parses; the shared package action keeps that format
      # for every platform. The Unix sidecars are named after their asset -
      # SHA256SUMS is the Windows spelling, the only one update.rs's
      # CHECKSUMS_ASSET reads, and the README documents both.
      - name: Package artifact
        uses: ./.github/actions/package-release
        with:
          binary: target/release/mnvoice
          asset: mnvoice-linux-x64
          sidecar: mnvoice-linux-x64.sha256

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ github.ref_name }}
          files: |
            mnvoice-linux-x64
            mnvoice-linux-x64.sha256

  macos:
    if: >-
      github.event_name == 'pull_request' ||
      endsWith(github.ref_name, '-macos')
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The release tag and the crate version must name the same release: the
      # updater compares tags, Windows Explorer reads Cargo.toml, and a tag
      # pushed without the bump ships a binary whose two versions disagree.
      - name: Verify the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          named="${tag#v}"          # drop the leading v
          named="${named%%-*}"      # drop a platform suffix (-win/-linux/-macos)
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$named" != "$crate" ]; then
            echo "::error file=Cargo.toml::release tag $tag names version $named, but Cargo.toml declares $crate - bump the crate before tagging"
            exit 1
          fi
          echo "tag $tag matches crate version $crate"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Test
        run: cargo test --locked --target aarch64-apple-darwin

      - name: Build release
        # The target is named explicitly rather than taken from the runner:
        # the release asset is published under the arm64 name, so an
        # Intel-armed image switching under us must not silently change it.
        run: cargo build --release --locked --target aarch64-apple-darwin

      # The shared package action prints "<hash>  <name>" with two spaces, the
      # exact format the updater parses, using whichever sha256 spelling this
      # runner carries (see the Linux job for the naming note).
      - name: Package artifact
        uses: ./.github/actions/package-release
        with:
          binary: target/aarch64-apple-darwin/release/mnvoice
          asset: mnvoice-macos-arm64
          sidecar: mnvoice-macos-arm64.sha256

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ github.ref_name }}
          files: |
            mnvoice-macos-arm64
            mnvoice-macos-arm64.sha256
