name: Publish release
description:
  Publish (or upload to) this tag's release, then confirm every expected asset
  actually landed. Shared by all three platform jobs so their publish behavior
  cannot drift apart.
inputs:
  tag:
    required: true
    description: The release tag being published.
  files:
    required: true
    description: |
      Newline-separated asset files to upload and verify, e.g.
      "mnvoice-linux-x64
      mnvoice-linux-x64.sha256". Every name is checked on the release.
runs:
  using: composite
  steps:
    # One step on purpose: the publish and the verification must agree
    # exactly on which names are expected, so the list is parsed once, here.
    - name: Publish and verify release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        # Inputs reach the script through the environment, never by string
        # interpolation: "${{ inputs.tag }}" pastes caller-controlled text
        # straight into the PowerShell source (the classic injection pattern),
        # while an env read is always a plain value. The sibling
        # verify-release-tag action sets the same example; do not revert this.
        TAG: ${{ inputs.tag }}
        FILES: ${{ inputs.files }}
        REPO: ${{ github.repository }}
      run: |
        $ErrorActionPreference = 'Stop'
        $tag = $env:TAG
        $repo = $env:REPO
        $files = @($env:FILES -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
        # Fail closed on an empty list: both verification loops below would
        # silently no-op and this step would report "confirmed assets" having
        # checked nothing. required:true does not enforce non-empty.
        #
        # Guards collect into $failed and are raised ONCE, not by `throw`. A
        # terminating `throw` leaves PowerShell in a state that stops the rest
        # of this same `run:` block, so throwing from a guard would skip the
        # upload, the API cross-check and the confirmation line. And
        # $ErrorActionPreference='Stop' does not close that hole: it governs
        # cmdlet errors, not native ones - a failing `gh` or `curl` falls
        # through to the next statement with only $LASTEXITCODE to show for it
        # (measured on Windows PowerShell 5.1). Every native call below is
        # therefore followed by an explicit $LASTEXITCODE check.
        #
        # The failures are reported with Write-Host, not Write-Error: under
        # $ErrorActionPreference='Stop' a Write-Error is itself a terminating
        # error, which would reintroduce exactly the behaviour being removed
        # here. Write-Host plus an explicit `exit 1` reports every problem in
        # one run and still fails the step.
        $failed = @()
        if ($files.Count -eq 0) { $failed += "no asset names were passed to publish-release" }
        foreach ($f in $files) {
          if (!(Test-Path $f)) { $failed += "$f was not produced" }
        }
        if ($failed.Count -gt 0) {
          foreach ($m in $failed) { Write-Host "ERROR: $m" -ForegroundColor Red }
          exit 1
        }
        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag @files --clobber
        } else {
          gh release create $tag --title $tag --verify-tag @files
        }
        if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: gh release failed with exit code $LASTEXITCODE" -ForegroundColor Red; exit 1 }
        Write-Host "published $tag"

        # Belt and braces: an empty or partial release must never ship unnoticed.
        # The REST endpoint is asked directly because gh's own release listing
        # is cached and can still lag behind an upload that just succeeded, which
        # would fail this step after a publish that actually worked.
        # ${{ github.repository }} is the owner/repo this release publishes
        # under. update.rs hardcodes that slug as literals in its URLs, so the
        # two are kept in step by hand: a fork must change BOTH for its own
        # binaries to update from it.
        # The auth header goes on stdin, not the command line. `-H
        # "Authorization: Bearer $token"` puts the secret in the native
        # process's argv, where any process listing on the runner can read it;
        # `--config -` keeps it off argv entirely. This is the same standard the
        # comments above set for inputs, applied to the one value that is a
        # credential rather than a parameter.
        $curlConfig = @(
          "header = `"Authorization: Bearer $env:GH_TOKEN`""
          "header = `"Accept: application/vnd.github+json`""
        ) -join "`n"
        $json = $curlConfig | curl -sS -f --config - "https://api.github.com/repos/$repo/releases/tags/$tag" | Out-String
        if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: could not read $tag from api.github.com (curl exit $LASTEXITCODE)" -ForegroundColor Red; exit 1 }
        $assets = @(($json | ConvertFrom-Json).assets.name)
        $missing = @($files | Where-Object { $assets -notcontains $_ })
        if ($missing.Count -gt 0) {
          # One error naming everything absent, so a partial upload is
          # diagnosed in a single run instead of one file per run.
          Write-Host "ERROR: release $tag is missing $($missing -join ', '). Assets found: '$($assets -join ', ')'"
          exit 1
        }
        Write-Host "confirmed assets on $tag"
