# Gate settings for mnvoice. commands.test is the only baseline the Test step
# has: without it the step improvises a harness from scratch. The Windows cargo
# reached through the WSL mount is the only toolchain that can build this
# crate on this machine, and its target dir must sit on Windows disk because
# the 9p mount supports no Windows file locking.
commands:
  test: WSLENV=CARGO_TARGET_DIR CARGO_TARGET_DIR=C:/Users/tyanw/AppData/Local/Temp/mnvoice-gate-target /mnt/c/Users/tyanw/.cargo/bin/cargo.exe test

# Every push and pull_request already runs windows/linux/macos on real runners
# (release.yml), so the pipeline monitors those instead of inventing its own.
no_ci: true
