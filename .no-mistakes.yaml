# Gate settings for mnvoice. commands.test is the only baseline the Test step
# has: without it the step improvises a harness from scratch.
#
# The test command runs the NATIVE toolchain, not the Windows cargo through
# the WSL mount. The Windows path was stale twice over and is unrunnable:
# measured 2026-10-21, `/mnt/c` does not exist (the Windows drive is mounted
# at `/mnt/win`), and no Windows executable can be launched through the
# interop at all - `/mnt/win/Windows/System32/cmd.exe` fails to exec with
# "No such file or directory (os error 2)" and there is no WSLInterop binfmt
# entry. A gate that cannot run its own test command improvises a harness
# instead, which is exactly what this file exists to prevent.
#
# The native crate builds and tests in ~6 s and is the authoritative local
# suite (AGENTS.md, "Toolchain & Testing Scope"). Windows proof is CI's job:
# release.yml runs the crate's tests on real windows/linux/macos runners for
# every pull request, and the pipeline waits on those real checks.
commands:
  test: cargo test --locked

# The Test step is an agent, so it also reads AGENTS.md. The user's live
# mnvoice.exe holds the `mnvoice-single-instance` mutex, so it must never be
# stopped to free it.
test:
  instructions: >-
    The user's live mnvoice.exe runs continuously on this machine
    (C:\Users\tyanw\bin\mnvoice.exe). Do NOT kill, terminate, or replace any
    running mnvoice.exe process, and do not mutate the live bin/mnvoice.exe
    install. Test behavior using pure unit tests through cargo test --locked.

# A pull_request runs all three jobs (windows/linux/macos), and each platform's
# tag push runs that job, all on real runners (release.yml), so the pipeline
# waits on those real checks for every PR rather than inventing its own.
ci_timeout: 30m
